[package]
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
autobins = false
description = "The Orbital Windowing System and Compositor"
license-file = "LICENSE"
name = "orbital"
readme = "README.md"
repository = "https://gitlab.redox-os.org/redox-os/orbital"
version = "0.1.0"
edition = "2024"

[features]
# Explicit opt-in for the inherited Redox daemon. The portable workspace never
# enables this feature.
redox-compat = []

[[bin]]
name = "orbital"
path = "src/main.rs"
required-features = ["redox-compat"]

[dependencies]
drm = "0.15"
graphics-ipc = { git = "https://gitlab.redox-os.org/redox-os/base.git" }
inputd = { git = "https://gitlab.redox-os.org/redox-os/base.git" }
log = "0.4.14"
orbclient = { version = "0.4.4", features = ["image"] }
orbfont = "0.4"
redox-log = { git = "https://gitlab.redox-os.org/redox-os/redox-log.git" }
redox_syscall = { version = "0.9.0",  features = ["std"] }
redox-scheme = "0.11.2"
libredox = "0.1.18"
plain = "0.2"
serde = "1"
serde_derive = "1"
thiserror = "2.0.12"
toml = "0.7"
# Downgrade due to improper x86 CPU feature detection
ab_glyph_rasterizer = "=0.1.5"
redox_event = "0.4.8"

[patch."https://gitlab.redox-os.org/redox-os/base.git"]
#graphics-ipc = { path = "../../../core/base/source/drivers/graphics/graphics-ipc" }
#inputd = { path = "../../../core/base/source/drivers/inputd" }

# The inherited Orbital source remains the Redox compatibility implementation,
# but it is intentionally not auto-built on the host. It requires Redox scheme,
# input, and DRM services that are neither present nor part of Cosmic's ABI.
# New Cosmic work lives in independently testable host-first crates below.
[workspace]
members = [
    "crates/cosmic-present",
    "crates/cosmic-display-core",
    "crates/cosmic-display-host",
]
default-members = [
    "crates/cosmic-present",
    "crates/cosmic-display-core",
    "crates/cosmic-display-host",
]
resolver = "3"
